<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion Lab, explained</title>
<link rel="stylesheet" href="design.css">
<script type="importmap">
{"imports": {"three": "/_vendor/three/build/three.module.js", "three/addons/": "/_vendor/three/examples/jsm/"}}
</script>
<style>
  #chapter .kicker { position: absolute; left: 56px; top: 40px; }
  #chapter .name { position: absolute; left: 56px; top: 66px; font-size: 30px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
  #chapter .credit { position: absolute; right: 56px; top: 44px; text-align: right; font-size: 20px; color: var(--muted); }
  #chapter .ticks { position: absolute; left: 56px; right: 56px; top: 116px; height: 4px; }
  #chapter .tick { position: absolute; top: 0; height: 4px; border-radius: 2px; background: var(--line); }
  #chapter .tick i { position: absolute; inset: 0; border-radius: 2px; background: var(--ink); transform-origin: left center; }
  .placeholder { position: absolute; left: 80px; right: 80px; top: 300px; text-align: left; }
</style>
</head>
<body>
<div id="chapter"></div>
<div id="stage"></div>
<div id="cap"></div>
<script src="words.js"></script>
<script src="music/beats.js" onerror="window.BEATS = { bpm: 120, first: 0 }"></script>
<script type="module">
import { make, sceneWindow, captions, swap, style, show, p01, easeOut } from "./kit.js";

// The article's nine sections, by the scenes that cover them.
const CHAPTERS = [
  { name: "The one-prompt myth", scenes: ["s01", "s02", "s03"] },
  { name: "Experiment 1 · Vague vs directed", scenes: ["s04", "s05"] },
  { name: "How code becomes video", scenes: ["s06", "s07", "s08"] },
  { name: "Anatomy of a directed prompt", scenes: ["s09", "s10"] },
  { name: "The numbers", scenes: ["s11", "s12", "s13"] },
  { name: "Experiment 2 · The principles", scenes: ["s14", "s15"] },
  { name: "The review loop", scenes: ["s16", "s17"] },
  { name: "Engines and the last mile", scenes: ["s18", "s19"] },
  { name: "When things break", scenes: ["s20"] },
];
const ids = Object.keys(window.SCENES);
window.NARRATION_TEXT = Object.fromEntries((await (await fetch("narration.json")).json()).scenes.map((s) => [s.id, s.text]));
const wins = Object.fromEntries(ids.map((id) => [id, sceneWindow(id)]));
const chapterOf = (id) => CHAPTERS.findIndex((c) => c.scenes.includes(id));

// ---- chapter bar ----
const bar = document.getElementById("chapter");
make("div", "label kicker", "Motion Lab, explained", bar);
make("div", "credit", "From Florence’s article · @flxrnc", bar);
const names = CHAPTERS.map((c, i) => make("div", "name", `<span class="mono" style="color:var(--muted)">0${i + 1}</span>&nbsp;&nbsp;${c.name}`, bar));
const ticks = make("div", "ticks", "", bar);
const total = window.NARRATION.duration;
const chapterSpan = CHAPTERS.map((c) => ({ t0: wins[c.scenes[0]].cutIn, t1: wins[c.scenes.at(-1)].cutOut }));
const tickFills = chapterSpan.map(({ t0, t1 }) => {
  // The ticks span the article's sections only; the end card after them has no chapter.
  const span = chapterSpan.at(-1).t1;
  const gap = 8, x = (t0 / span) * 968, w = ((t1 - t0) / span) * 968 - gap;
  const tk = make("div", "tick", "", ticks, { left: `${x}px`, width: `${w}px` });
  return make("i", "", "", tk);
});

// ---- scenes: each module default-exports build(root, k) -> (t) => void | Promise ----
const stage = document.getElementById("stage");
const kit = await import("./kit.js");
const seekers = {};
for (const id of ids) {
  const root = make("section", "scene", "", stage);
  root.dataset.scene = id;
  let build = null;
  try { build = (await import(`./scenes/${id}.js`)).default; } catch (e) {
    if (!/Failed to fetch|Importing a module|404/.test(String(e))) throw e;
  }
  if (build) {
    seekers[id] = await build(root, { ...kit, id, win: wins[id] });
  } else {
    // Placeholder until the scene is built: its id and narration.
    const n = window.NARRATION_TEXT?.[id] ?? "";
    make("div", "placeholder", `<div class="label">${id} · placeholder</div><div class="body" style="margin-top:16px">${n}</div>`, root);
    seekers[id] = () => {};
  }
}

// ---- seek ----
const cap = document.getElementById("cap");
let current = null;
window.seek = (t) => {
  const id = ids.find((s) => t >= wins[s].cutIn && t < wins[s].cutOut) ?? ids.at(-1);
  if (id !== current) {
    for (const el of stage.children) el.classList.toggle("on", el.dataset.scene === id);
    current = id;
  }
  const ci = chapterOf(id);
  names.forEach((el, i) => {
    const { t0, t1 } = chapterSpan[i];
    // Chapter 1 is already up at frame 0, so the thumbnail shows its name.
    // Chapter names change with the scene cut (a cut is a cut): fully on from the cut frame.
    const on = t >= (i === 0 ? -1 : t0) && t < t1;
    el.style.opacity = on ? 1 : 0;
    el.style.transform = "none";
    el.style.visibility = on ? "visible" : "hidden";
  });
  tickFills.forEach((el, i) => {
    const { t0, t1 } = chapterSpan[i];
    el.style.transform = `scaleX(${p01(t, t0, t1 - t0).toFixed(4)})`;
  });
  captions(cap, t);
  return seekers[id](t);
};

window.VIDEO = { width: 1080, height: 1350, duration: total,
  cuts: ids.slice(1).map((id) => wins[id].cutIn),   // hard cuts: motion blur never blends two scenes
  stills: ids.map((id) => +((wins[id].start + wins[id].end) / 2).toFixed(2)) };
</script>
</body>
</html>
